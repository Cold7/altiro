[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orthoresponse"
version = "0.4.0"
description = "Classify expression response models (stress-ready, shared, unique, opposite, no response) of orthologs or genes in 2 x 2 designs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "J. Sebastián Contreras-Riquelme", email = "contrerasriquelme.sebastian@gmail.com" }]
requires-python = ">=3.9"
keywords = ["RNA-seq", "orthologs", "differential expression", "stress-ready", "comparative transcriptomics", "DESeq2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.21", "pandas>=1.3", "scipy>=1.7"]

[project.optional-dependencies]
deseq = ["pydeseq2>=0.4"]
plot = ["matplotlib>=3.5"]
excel = ["openpyxl>=3.0"]
all = ["pydeseq2>=0.4", "matplotlib>=3.5", "openpyxl>=3.0"]
test = ["pytest>=7"]

[project.scripts]
orthoresponse = "orthoresponse.cli:main"

[project.urls]
Homepage = "https://github.com/Cold7/orthoresponse"
Documentation = "https://github.com/Cold7/orthoresponse/blob/main/docs/manual.md"
"Original publication" = "https://doi.org/10.1371/journal.pone.0324724"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orthoresponse = ["data/*.tsv", "data/*.tsv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
